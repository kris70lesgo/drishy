[package]
name = "drishy"
version = "0.1.0"
edition = "2024"
description = "A Rust QOI codec with parallel restart-block decoding"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"

[dev-dependencies]
qoi = "0.4.1"
rapid-qoi = "0.6.3"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "restart_qoi"
harness = false
